<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>全息圖速查</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#12100d;--card:#1c1913;--line:#33291a;--gold:#c9a35c;--gold2:#e6c98a;--tx:#efe8da;--dim:#9a8f7a;--red:#c96b5c;--green:#7ca86b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:60px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;color:var(--gold2);font-weight:600;letter-spacing:.05em}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
button{background:var(--gold);color:#1a150c;border:0;border-radius:10px;padding:10px 16px;font-size:1rem;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button.sm{padding:6px 12px;font-size:.9rem}
input,textarea{width:100%;background:#252017;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font-size:1rem}
input:focus,textarea:focus{outline:1px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.gold{border-color:var(--gold)}
.label{font-size:.8rem;color:var(--dim);letter-spacing:.08em;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;background:#2a2417;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;margin:2px}
.chip.like{border-color:var(--green);color:#b9d4ad}
.chip.hate{border-color:var(--red);color:#e0a89e}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#1a150c;font-weight:600}
.chip.tap{cursor:pointer;padding:5px 14px;font-size:.95rem}
.chip.miss{border-color:var(--red);color:#e0a89e;font-weight:700}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid9 .cell{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px}
.grid9 .cell b{font-size:1.2rem}
.grid9 .cell.on{border-color:var(--gold)}
.grid9 .cell.zero{opacity:.45}
.bignum{font-size:2.6rem;font-weight:700;color:var(--gold2);line-height:1}
.person{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.person:active{background:#211c14}
.muted{color:var(--dim);font-size:.85rem}
.err{color:var(--red);margin:8px 0}
.hide{display:none}
.note{border-left:2px solid var(--gold);padding:4px 10px;margin:8px 0;font-size:.92rem}
svg text{fill:var(--tx);font-family:inherit}
.sec{margin-top:14px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app">載入中…</div>
<script>
// ══ 設定（部署時填入）═════════════════════════════
const CFG = {
  LIFF_ID: "2011346323-gv1KiHt5",                             // LINE Developers → LIFF app ID
  API: "https://wgxfhmhuxuwltvlvukie.supabase.co/functions/v1/api", // Supabase Edge Function URL
  DEV: location.protocol === "file:" || location.hostname === "localhost", // 本機開發：假資料
};
// ═══════════════════════════════════════════════

const $ = (s) => document.querySelector(s);
const app = $("#app");
let idToken = null;
const CATS = ["潛客", "客戶", "夥伴", "朋友", "家人"];
let curCat = "";   // 首頁分類篩選
let allPeople = [];

async function api(path, opt = {}) {
  if (CFG.DEV) return devApi(path, opt);
  const res = await fetch(CFG.API + path, {
    ...opt,
    headers: { Authorization: "Bearer " + idToken, "Content-Type": "application/json", ...(opt.headers || {}) },
  });
  if (res.status === 401) { liff.login(); throw new Error("重新登入中…"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

// ── 畫面 ────────────────────────────────────────
function esc(s){return String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function viewHome(q = "") {
  app.innerHTML = `
    <div class="topbar"><h1>全息圖速查</h1><button class="sm" onclick="viewAdd()">＋ 建檔</button></div>
    <input id="q" placeholder="🔍 打名字快速查找…" value="${esc(q)}">
    <div class="row sec" id="catbar">${["", ...CATS].map((c) =>
      `<span class="chip tap${c === curCat ? " sel" : ""}" onclick="setCat('${c}')">${c || "全部"}</span>`).join("")}</div>
    <div class="card sec"><div class="label">快速排盤（不存檔）</div>
      <div class="row"><input id="qbd" type="date" style="flex:1">
      <button class="sm" onclick="quickAnalyze()">排盤</button></div></div>
    <div id="list" class="sec muted">載入中…</div>`;
  $("#q").oninput = deb(() => loadList($("#q").value), 250);
  loadList(q);
}
function setCat(c) { curCat = c; viewHome($("#q") ? $("#q").value : ""); }
function renderList() {
  const people = curCat ? allPeople.filter((p) => (p.tags || []).includes(curCat)) : allPeople;
  $("#list").innerHTML = people.length
    ? people.map((p) => `<div class="person" onclick="viewPerson('${p.id}')">
        <div><b>${esc(p.name)}</b> <span class="muted">${p.birthday}</span></div>
        <div>${(p.tags||[]).map((t)=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`).join("")
    : `<div class="muted">${curCat ? `「${esc(curCat)}」分類還沒有人。` : "還沒有名單，按右上「＋建檔」開始。"}</div>`;
}
async function loadList(q) {
  try {
    const { people } = await api("/people" + (q ? "?q=" + encodeURIComponent(q) : ""));
    allPeople = people;
    renderList();
  } catch (e) { $("#list").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function viewAdd() {
  app.innerHTML = `
    <div class="topbar"><h1>建檔</h1><button class="ghost sm" onclick="viewHome()">← 返回</button></div>
    <div class="card">
      <div class="label">姓名</div><input id="f_name">
      <div class="label sec">生日（國曆西元）</div><input id="f_bd" type="date">
      <div class="label sec">分類（點選，可複選）</div>
      <div class="row" id="f_cats">${CATS.map((c) =>
        `<span class="chip tap" data-cat="${c}" onclick="this.classList.toggle('sel')">${c}</span>`).join("")}</div>
      <div class="sec"><button onclick="doAdd()">儲存並排盤</button></div>
      <div id="msg"></div></div>`;
}
async function doAdd() {
  try {
    const tags = [...document.querySelectorAll("#f_cats .chip.sel")].map((el) => el.dataset.cat);
    const { person } = await api("/people", { method: "POST",
      body: JSON.stringify({ name: $("#f_name").value.trim(), birthday: $("#f_bd").value, tags }) });
    viewPerson(person.id);
  } catch (e) { $("#msg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function quickAnalyze() {
  const bd = $("#qbd").value;
  if (!bd) return;
  try { const { analysis } = await api("/analyze?birthday=" + bd); renderAnalysis(null, analysis); }
  catch (e) { alert(e.message); }
}
async function viewPerson(id) {
  app.innerHTML = "載入中…";
  try { const { person, analysis } = await api("/people/" + id); renderAnalysis(person, analysis); }
  catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div><button onclick="viewHome()">返回</button>`; }
}

function renderAnalysis(person, a) {
  const c = a.chart, m = a.main, d = a.doctrine;
  const chips = (arr, cls) => arr.map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join("");
  app.innerHTML = `
    <div class="topbar"><h1>${person ? esc(person.name) : "快速排盤"}</h1>
      <button class="ghost sm" onclick="viewHome()">← 返回</button></div>
    <div class="muted" style="margin:-6px 0 10px">${esc(a.birthday||"")}｜主性格 <b style="color:var(--gold2)">${m.n} 號人</b>｜${esc(d.label)}</div>

    <div class="card"><div class="label">全息圖</div>${chartSvg(c)}
      ${weightGrid(a)}
      <div class="muted sec">多（${esc(a.presenceMeaning?.many||"")}）：${a.presence.many.join("、")||"—"}<br>
      剛好（${esc(a.presenceMeaning?.just||"")}）：${a.presence.just.join("、")||"—"}<br>
      內沒外有：${a.presence.outer_only.join("、")||"—"}｜內外皆無（${esc(a.presenceMeaning?.none||"")}）：${a.presence.none.join("、")||"—"}</div>
    </div>

    <div class="card gold">
      <div class="row" style="justify-content:space-between">
        <div><span class="bignum">${m.n}</span><div class="muted">主性格 60%</div></div>
        <div style="text-align:right"><div style="color:var(--gold2);font-weight:600">${esc(d.label)}｜${esc(d.talk)}</div>
        <div class="muted">${esc(d.live)}・${esc(d.money)}</div></div>
      </div>
      <div class="sec"><div class="label">溝通風格</div>${esc(d.style)}</div>
      <div class="sec"><div class="label">他喜歡</div>${chips(m.comm.like, "like")}</div>
      <div><div class="label">他討厭（踩了就掉單）</div>${chips(m.comm.hate, "hate")}</div>
    </div>

    <div class="card">
      <div class="label">主性格 ${m.n}｜${esc(m.gift)}（五行屬${esc(m.five)}）</div>
      <div>天賦：${esc(m.talent)}｜個性：${esc(m.persona)}</div>
      <div>自我期望：<b>${esc(m.expect)}</b></div>
      <div class="sec"><div class="label">高能量</div>${chips(m.high, "like")}</div>
      <div><div class="label">低能量</div>${chips(m.low, "hate")}</div>
    </div>

    <div class="card">
      <div class="label">${esc(a.icebreaker.note||"破冰切入（左星位 10%）")}</div>
      <div><b>${a.icebreaker.n}</b>｜${esc(a.icebreaker.gift)}｜${esc(a.icebreaker.talent)}</div>
      ${a.icebreaker.high ? `<div>${chips(a.icebreaker.high, "like")}</div>` : ""}
      <div class="sec"><div class="label">${esc(a.innerCode.note||"右星位 10%")}</div>
      <div><b>${a.innerCode.n}</b>｜${esc(a.innerCode.gift)}｜${esc(a.innerCode.talent||"")}
      ${a.innerCode.expect ? `・期望「${esc(a.innerCode.expect)}」` : ""}</div></div>
      ${a.outerOnlyNote ? `<div class="sec"><div class="label">內沒外有（${esc(a.outerOnlyNote.meaning)}）</div>
        ${a.outerOnlyNote.gifts.map((g)=>`<span class="chip">${esc(g)}</span>`).join("")}</div>` : ""}
    </div>

    ${(a.deep||[]).map((s)=>`<div class="card">
      <div class="label">${esc(s.title)}</div>
      ${s.note ? `<div class="muted" style="margin-bottom:6px">${esc(s.note)}</div>` : ""}
      ${s.nums.map((x)=>`<div>${x.tag?`<span class="muted">${esc(x.tag)} </span>`:""}<b>${x.n}</b>｜${esc(x.gift)}｜${esc(x.talent)}</div>`).join("")}
    </div>`).join("")}

    ${person ? `<div class="card"><div class="label">複盤筆記</div>
      <div id="notes">${(person.notes||[]).map((n)=>`<div class="note">${esc(n.text)}<div class="muted">${n.ts.slice(0,10)}</div></div>`).join("")||'<div class="muted">還沒有筆記</div>'}</div>
      <div class="sec"><textarea id="newnote" rows="2" placeholder="這次聊完：哪裡準、哪裡不準、下一步…"></textarea></div>
      <div class="row sec"><button class="sm" onclick="addNote('${person.id}')">存筆記</button>
      <button class="ghost sm" onclick="delPerson('${person.id}')">刪除此人</button></div></div>` : ""}`;
}

function weightGrid(a) {
  const w = a.presence?.weight || {}; // 內圈 7 位權重加總（主60/星10·10/其餘各5）
  const nums = Array.from({ length: 9 }, (_, i) => i + 1);
  const missing = nums.filter((n) => !w[n]);
  return `${missing.length ? `<div class="sec"><span class="label">內圈缺少：</span>${missing.map((n)=>`<span class="chip miss">${n}</span>`).join("")}</div>` : ""}
  <div class="grid9">${nums.map((n)=>`<div class="cell ${w[n] ? "on" : "zero"}"><b>${n}</b><div class="muted">${w[n] || 0}%</div></div>`).join("")}</div>`;
}

function chartSvg(c) {
  const t = (x, y, v, size = 20, color = "var(--tx)", w = 400) =>
    `<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle" font-weight="${w}" fill="${color}">${v}</text>`;
  return `<svg viewBox="0 0 360 300" style="width:100%;max-width:360px;display:block;margin:0 auto">
    ${t(180, 28, c.R, 22, "var(--gold2)", 700)}
    ${t(150, 58, c.Q)} ${t(210, 58, c.P)}
    <path d="M85 115 Q180 42 275 115" stroke="var(--line)" fill="none" stroke-width="2"/>
    ${t(18, 112, c.S, 18, "var(--gold)", 700)} ${t(37, 112, "=", 14, "var(--dim)")} ${t(56, 112, c.X, 17, "var(--dim)")} ${t(76, 112, c.W, 17, "var(--dim)")}
    ${t(284, 112, c.V, 17, "var(--dim)")} ${t(304, 112, c.U, 17, "var(--dim)")} ${t(323, 112, "=", 14, "var(--dim)")} ${t(342, 112, c.T, 18, "var(--gold)", 700)}
    ${t(180, 122, c.O, 34, "var(--gold2)", 700)}
    <text x="180" y="142" font-size="11" text-anchor="middle" fill="var(--dim)">主性格</text>
    <line x1="100" y1="165" x2="260" y2="165" stroke="var(--line)" stroke-width="2"/>
    ${t(140, 196, c.M, 24)} ${t(220, 196, c.N, 24)}
    <line x1="70" y1="215" x2="290" y2="215" stroke="var(--line)" stroke-width="2"/>
    ${t(100, 248, c.I, 24, "var(--gold)", 700)} ${t(153, 248, c.J, 24)} ${t(207, 248, c.K, 24)} ${t(260, 248, c.L, 24, "var(--gold)", 700)}
    <text x="100" y="265" font-size="10" text-anchor="middle" fill="var(--gold)">★破冰</text>
    <text x="260" y="265" font-size="10" text-anchor="middle" fill="var(--gold)">★卡點</text>
    ${t(180, 292, c.digits.join(" "), 14, "var(--dim)")}
  </svg>`;
}

async function addNote(id) {
  const text = $("#newnote").value.trim();
  if (!text) return;
  await api("/people/" + id, { method: "PATCH", body: JSON.stringify({ add_note: text }) });
  viewPerson(id);
}
async function delPerson(id) {
  if (!confirm("確定刪除？")) return;
  await api("/people/" + id, { method: "DELETE" });
  viewHome();
}
function deb(fn, ms) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }

// ── DEV 假資料（僅本機看版面用，非真規則文案）──
function devApi(path, opt) {
  const A = { birthday: "1980-10-06",
    chart: { digits: [0,6,1,0,1,9,8,0], I:6,J:1,K:1,L:8,M:7,N:9,O:7,P:5,Q:7,R:3,S:3,T:9,U:8,V:1,W:8,X:4 },
    presence: { many: [1,6,7,8], just: [9], outer_only: [3,4,5], none: [2],
      weight: {1:10, 2:0, 3:0, 4:0, 5:0, 6:10, 7:65, 8:10, 9:5} },
    doctrine: { label: "示意主義", talk: "談XX", live: "活在示意中", money: "示意金錢觀", style: "示意溝通風格文案" },
    main: { n: 7, gift: "示意 特質", five: "示", talent: "示意能力", persona: "示意個性", expect: "示意期望",
      high: ["示意高1","示意高2"], low: ["示意低1","示意低2"], comm: { like: ["示意喜歡A","示意喜歡B"], hate: ["示意討厭A"] } },
    icebreaker: { n: 6, gift: "示意", talent: "示意能力", high: ["示意高1","示意高2"], note: "左星位 10%｜破冰切入" },
    innerCode: { n: 8, gift: "示意", talent: "示意能力", expect: "示意期望", note: "右星位 10%｜卡點" },
    motivation: [6,1], energy: [1,8], subconscious: [6,8,7],
    presenceMeaning: { many: "示意明顯", just: "示意適中", outer_only: "示意外有", none: "示意缺" },
    deep: [
      { title: "內圈 5% 位", note: "示意說明", nums: [{tag:"下排",n:1,gift:"示意",talent:"示意能力"},{tag:"中排",n:7,gift:"示意",talent:"示意能力"}] },
      { title: "動機（起心動念）＝下排左二碼", nums: [{n:6,gift:"示意",talent:"示意能力"},{n:1,gift:"示意",talent:"示意能力"}] },
      { title: "外圈 21–40 歲｜工作·人際", note: "示意外圈說明", nums: [{n:4,gift:"示意",talent:"示意能力"},{n:8,gift:"示意",talent:"示意能力"},{tag:"總",n:3,gift:"示意",talent:"示意能力"}] },
    ],
    outerOnlyNote: { nums: [3,4,5], meaning: "示意說明", gifts: ["3＝示意","4＝示意","5＝示意"] } };
  const P = { id: "00000000-0000-4000-8000-000000000000", name: "測試客戶", birthday: "1980-10-06",
    tags: ["客戶"], notes: [{ ts: "2026-08-31T00:00:00Z", text: "示意筆記" }] };
  if (path.startsWith("/analyze")) return { analysis: A };
  if (path.startsWith("/people/")) return { person: P, analysis: A };
  if (path.startsWith("/people")) return opt.method === "POST" ? { person: P } : { people: [P] };
  return {};
}

// ── 啟動 ────────────────────────────────────────
(async () => {
  if (CFG.DEV) { viewHome(); return; }
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    viewHome();
  } catch (e) { app.innerHTML = `<div class="err">LIFF 初始化失敗：${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
